name: Deploy MedSatya to Databricks Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Secrets (Settings → Secrets and variables → Actions):
#   DATABRICKS_HOST         e.g. https://dbc-ad43c802-45af.cloud.databricks.com
#   DATABRICKS_TOKEN        PAT of the deploy identity (never printed / committed)
#   DATABRICKS_APP_NAME     e.g. medsatya
#   DATABRICKS_SOURCE_PATH  e.g. /Workspace/Users/<you>/medsatya-src
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  APP_NAME: ${{ secrets.DATABRICKS_APP_NAME }}
  SRC_PATH: ${{ secrets.DATABRICKS_SOURCE_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Sync source to workspace
        run: |
          databricks sync . "$SRC_PATH" --full \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --include 'frontend/dist/**'

      - name: Deploy app
        run: |
          databricks apps deploy "$APP_NAME" --source-code-path "$SRC_PATH"

      - name: Report status
        run: databricks apps get "$APP_NAME" -o json | python3 -c "import sys,json;d=json.load(sys.stdin);print('app:',d.get('name'),'url:',d.get('url'))"
